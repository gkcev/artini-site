<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Başvurun bize ulaştı · artini</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
:root{--wall:#F6F3EE;--wall-warm:#EFE8DE;--ink:#1E1D1B;--ink-soft:#5C5852;--line:#E2DDD4;--blue:#1A47A6;--blue-dark:#12367F;--serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:40px 20px;font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 85% 10%,#FFFDF9 0%,var(--wall) 55%,var(--wall-warm) 100%)}
main{max-width:560px;text-align:center}
.logo{font-size:30px;text-decoration:none;color:inherit}
h1{font-weight:400;font-size:clamp(34px,5vw,48px);line-height:1.1;letter-spacing:-.015em;margin:36px 0 16px}
p{font-size:18px;color:var(--ink-soft);margin:0 0 32px}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--blue);color:#fff;text-decoration:none;font-size:16px;padding:13px 26px;border-radius:2px}
.btn:hover{background:var(--blue-dark)}
</style>
</head>
<body>
<main>
  <a class="logo" href="/">artini</a>
  <h1>Teşekkürler, başvurun bize ulaştı.</h1>
  <p>Eserlerine özenle bakıp birkaç gün içinde e-postayla döneceğiz. Bu arada Instagram'da bizi takip edebilirsin.</p>
  <a class="btn" href="https://www.instagram.com/artini.io/" target="_blank" rel="noopener">@artini.io <span>→</span></a>
</main>
</body>
</html>
